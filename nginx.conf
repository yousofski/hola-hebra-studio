server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # OJO con add_header en nginx: un bloque `location` que tenga su PROPIO
  # add_header deja de heredar los del servidor. Por eso las cabeceras de
  # seguridad se repiten dentro de cada location; sin repetirlas, las tres
  # desaparecían en la página real (comprobado en producción).

  # El HTML nunca se cachea: cuando cambies un enlace y redespliegues,
  # el visitante lo ve al instante.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Fuentes y logo: un año, son inmutables.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_types text/css image/svg+xml application/javascript;
  gzip_min_length 512;

  location / { try_files $uri $uri/ /index.html; }
}
